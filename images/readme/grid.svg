<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352"><foreignObject x="0" y="0" width="900" height="352"><div xmlns="http://www.w3.org/1999/xhtml" class="root"><style>@font-face{font-family:'NK';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'NB';src:url(data:font/woff;base64,) format('woff');}
*{box-sizing:border-box;margin:0;padding:0}
.root{width:900px;font-family:'NB',Nunito,sans-serif;font-weight:700;color:#ebe7e7;text-align:center;padding:8px 0}
.k{font-family:'NK',Nunito,sans-serif;font-weight:900}
.pink{color:#ff7eb6}
.muted{color:#a9a4ae}
.bar{width:90px;height:6px;border-radius:3px;background:#ff7eb6;margin:0 auto 14px}
.o{display:inline-block;color:#ff7eb6;transform-origin:50% -0.25em;animation:dangle 4s ease-in-out infinite}
@keyframes dangle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.icon{width:120px;height:120px;display:block;margin:0 auto 6px}
.title{font-size:62px;line-height:1.15}
.sub{font-size:22px}
.namebar{width:140px;margin:12px auto 14px}
.by{font-size:15px;margin-top:12px;color:#ff7eb6;opacity:.85}
.small-title{font-size:40px;line-height:1.1}
h2{font-size:32px;line-height:1.2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 34px;text-align:left;padding:6px 22px}
.grid .mini{width:34px;height:5px;border-radius:2.5px;background:#ff7eb6;margin-bottom:10px}
.grid h3{font-size:23px;margin-bottom:6px}
.grid p{font-size:16px;line-height:1.45}
.grid>div:last-child:nth-child(odd){grid-column:1/-1}
.plugin{display:flex;align-items:center;gap:26px;text-align:left;padding:6px 22px}
.plugin img{width:118px;height:118px;flex:none}
.plugin .txt{flex:1}
.plugin h3{font-size:34px;line-height:1.15;margin-bottom:6px}
.plugin p{font-size:18px;line-height:1.45}
.btn{flex:none;background:#ff7eb6;color:#fff;border:2.5px solid #fff;border-radius:999px;padding:9px 22px;font-size:17px}
.sparkle{position:absolute;color:#ff7eb6;opacity:.55}
.wrap{position:relative}
</style><div class="grid"><div><div class="mini"></div><h3 class="k">Recent <span class="pink">updates</span></h3><p class="muted">Whenever plugins update, see what changed: old and new version, plus the changelog.</p></div><div><div class="mini"></div><h3 class="k">Available <span class="pink">updates</span></h3><p class="muted">Checks your plugin repositories for updates you haven&#x27;t installed yet. Update one, or all at once.</p></div><div><div class="mini"></div><h3 class="k">All <span class="pink">plugins</span></h3><p class="muted">The current changelog of every plugin you have installed, newest release first.</p></div><div><div class="mini"></div><h3 class="k">GitHub <span class="pink">fallback</span></h3><p class="muted">No changelog in the plugin? It finds the matching GitHub release, or the most recent commits.</p></div><div><div class="mini"></div><h3 class="k">Ignore <span class="pink">list</span></h3><p class="muted">Hide update alerts for plugins you don&#x27;t care about, and bring them back any time.</p></div></div></div></foreignObject></svg>